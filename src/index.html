<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Message Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="addressInput" class="status-indicator">Disconnected</div>

    <div class="app-container">
      <h1>Message Board</h1>
      <div class="controls">
        <div id="auth-section">
          <button id="btn-connect">Conectar Wallet</button>
          <button id="btn-logout" style="display: none">Cerrar Sesión</button>
        </div>
        <input type="text" id="messageInput" placeholder="Escribe tu mensaje aquí..." />
        <button id="sendBtn">Send Message</button>
      </div>

      <div id="messagesContainer">
        <h1>Cantidad de mensajes: <span id="messageCount"></span></h1>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
